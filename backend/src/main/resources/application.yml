spring:
  application:
    name: shandong-weather-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shandong_weather}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:example_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml

server:
  port: ${SERVER_PORT:8080}

# Frozen API V2 display scope; IDs, names and units are always read from MySQL.
weather:
  workbench:
    city-codes: JINAN,QINGDAO,ZIBO,ZAOZHUANG,DONGYING,YANTAI,WEIFANG,JINING,TAIAN,WEIHAI,RIZHAO,LINYI,DEZHOU,LIAOCHENG,BINZHOU,HEZE
    model-codes: ECMWF,NOAA
    element-codes: T2M,PRECIP
